
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AANGAN | Faculty Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #101c33;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            background-color: white;
            width: 350px;
            padding: 30px;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
            color: #101c33;
            letter-spacing: 3px;
        }

        h2 {
            text-align: center;
            color: #b18a3b;
        }

        p {
            text-align: center;
            color: #718096;
            font-size: 14px;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background-color: #101c33;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background-color: #27b5ad;
        }

        .links {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
        }

        a {
            color: #a77924;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>AANGAN</h1>
        <h2>Faculty Gate</h2>

        <p>Welcome back, Teacher!</p>
        <p>Sign in to your faculty account.</p>

        <form id="teacherLoginForm">

            <label for="email">Teacher Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your registered email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">Login to Faculty Portal</button>

        </form>

        <div class="links">
            <p><a href="forgot-password.html">Forgot Password?</a></p>

            
<p>Don't have a faculty account yet?</p>

<p>
    <a href="teacher-signup.html">Sign Up / Request an Account</a>
</p>


            <p><a href="login.html">Back to Main Login</a></p>
        </div>

    </div>

    <script>
        document.getElementById("teacherLoginForm").addEventListener("submit", function(event) {

            event.preventDefault();

            alert("Teacher login will work after connecting Firebase authentication.");

        });
    </script>

</body>
</html>
