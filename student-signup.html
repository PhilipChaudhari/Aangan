<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AANGAN | Student Sign Up</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #101c33;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .signup-box {
            background-color: white;
            width: 350px;
            padding: 30px;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
            color: #101c33;
            letter-spacing: 3px;
        }

        h2 {
            text-align: center;
            color: #b18a3b;
        }

        p {
            text-align: center;
            color: #718096;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background-color: #101c33;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        button:hover {
            background-color: #27b5ad;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #a77924;
            text-decoration: none;
        }
    </style>
</head>

<body>

	
<script type="module">
import { auth } from "./firebase.js";

import {
  createUserWithEmailAndPassword,
  updateProfile,
  sendEmailVerification
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const signupForm = document.getElementById("signupForm");

signupForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  const fullName = document.getElementById("fullName").value.trim();
  const email = document.getElementById("email").value.trim();
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (password !== confirmPassword) {
    alert("Passwords do not match!");
    return;
  }

  try {
    const userCredential = await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );

    await updateProfile(userCredential.user, {
      displayName: fullName
    });

    await sendEmailVerification(userCredential.user);

    alert("Your AANGAN account has been created! Please verify your email.");

    window.location.href = "login.html";

  } catch (error) {
    alert("Signup error: " + error.message);
  }
});
</script>

<CodeBlock language="javascript" editable>
<script type="module">
import { auth } from "./firebase.js";

import {
  signInWithEmailAndPassword,
  signOut
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const loginForm = document.getElementById("loginForm");

loginForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {
    const userCredential = await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    const user = userCredential.user;

    if (!user.emailVerified) {
      await signOut(auth);
      alert("Please verify your email before logging in.");
      return;
    }

    alert("Welcome to AANGAN!");

    // Replace this with your actual student dashboard filename.
    window.location.href = "student-dashboard.html";

  } catch (error) {
    alert("Login failed: " + error.message);
  }
});
</script>

</body>
</html>
